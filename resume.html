<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"/>
<title>📸 صور الطلب — زمزم ديزيرت</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet"/>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<style>
:root{--rose:#c2185b;--rose-dark:#bd085c;--gold:#c8973a;--cream:#fff5f0}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Cairo',sans-serif;background:var(--cream);color:#333;min-height:100vh;direction:rtl}
.header{background:linear-gradient(135deg,var(--rose),var(--rose-dark));color:#fff;padding:20px 16px;text-align:center}
.header h1{font-size:20px;font-weight:900;margin-bottom:4px}
.header p{font-size:12px;opacity:.85}
.logo{font-size:32px;margin-bottom:6px}
.card{background:#fff;border-radius:14px;margin:14px;padding:16px;box-shadow:0 2px 10px rgba(0,0,0,.06);border:1.5px solid #f3e8e8}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:13px}
.info-item{background:#fef2f2;border-radius:8px;padding:8px 10px}
.info-label{font-size:10px;color:#999;font-weight:700;margin-bottom:2px}
.info-value{font-weight:800;color:#333}
.img-section{margin-top:14px}
.img-title{font-size:14px;font-weight:900;color:var(--rose);margin-bottom:10px;text-align:center}
.img-wrap{margin-bottom:14px;border-radius:12px;overflow:hidden;border:2px solid #f3e8e8;background:#fafafa}
.img-wrap img{width:100%;display:block;cursor:pointer}
.img-label{padding:8px;font-size:11px;color:#666;text-align:center;background:#fef2f2;font-weight:700}
.dl-btn{display:block;width:100%;padding:14px;background:linear-gradient(135deg,#16a34a,#15803d);color:#fff;border:none;border-radius:12px;font-size:15px;font-weight:900;cursor:pointer;font-family:'Cairo',sans-serif;text-align:center;margin-top:6px;text-decoration:none}
.dl-btn:active{transform:scale(.97)}
.loading{text-align:center;padding:60px 20px}
.loading .spin{font-size:40px;animation:spin 1s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
.error{text-align:center;padding:60px 20px;color:#dc2626}
.error .icon{font-size:48px;margin-bottom:10px}
.footer{text-align:center;padding:16px;font-size:10px;color:#999;margin-top:20px}
</style>
</head>
<body>

<div class="header">
  <div class="logo">🎂</div>
  <h1>زمزم ديزيرت</h1>
  <p>صور الطلب المرجعية</p>
</div>

<div id="content">
  <div class="loading">
    <div class="spin">🎂</div>
    <div style="margin-top:12px;font-size:14px;font-weight:800">جاري تحميل بيانات الطلب...</div>
  </div>
</div>

<div class="footer">
  Zamzam Dessert · Designed by Mahmoud Gamal Eldeen · 01508613866
</div>

<script>
(function(){
  var CAKE_FB_CONFIG = {
    apiKey: "AIzaSyCQjB6MjHeUMDAoiTTcuUrdXqk_RhHFWco",
    authDomain: "zamzam-cake.firebaseapp.com",
    databaseURL: "https://zamzam-cake-default-rtdb.firebaseio.com",
    projectId: "zamzam-cake",
    storageBucket: "zamzam-cake.firebasestorage.app",
    messagingSenderId: "439645389024",
    appId: "1:439645389024:web:a9397385556a38fc745085"
  };

  var app = firebase.initializeApp(CAKE_FB_CONFIG, 'resume');
  var db  = firebase.database(app);

  var params = new URLSearchParams(window.location.search);
  var orderId = params.get('id');

  if(!orderId){
    showError('❌ رابط غير صحيح', 'الرابط لازم يحتوي على رقم الطلب');
    return;
  }

  // ✅ تسجيل دخول مجهول أولاً — ثم قراءة البيانات بعد نجاحه
  firebase.auth(app).signInAnonymously().then(function(){
    // Auth نجح — دلوقتي نقرأ الطلب
    return db.ref('cake_orders/' + orderId).once('value');
  }).then(function(snap){
    if(!snap.exists()){
      showError('❌ الطلب غير موجود', 'رقم الطلب: ' + orderId);
      return;
    }
    var o = snap.val();
    renderOrder(o);
  }).catch(function(err){
    var msg = err.message || '';
    if(msg.indexOf('permission_denied') > -1){
      showError('🔐 تعذّر الوصول', 'جاري إعادة المحاولة...');
      // إعادة محاولة بعد ثانية
      setTimeout(function(){
        firebase.auth(app).signInAnonymously().then(function(){
          return db.ref('cake_orders/' + orderId).once('value');
        }).then(function(snap){
          if(snap.exists()) renderOrder(snap.val());
          else showError('❌ الطلب غير موجود', 'رقم الطلب: ' + orderId);
        }).catch(function(err2){
          showError('❌ خطأ في التحميل', err2.message || 'تعذّر الاتصال');
        });
      }, 1500);
    } else {
      showError('❌ خطأ في التحميل', msg);
    }
  });

  // أولاً: نجرب نجيب الصور من cake_images/ORDER_ID
  function loadImages(orderId, callback){
    db.ref('cake_images/' + orderId).once('value').then(function(snap){
      if(snap.exists()){
        var data = snap.val();
        var imgs = [];
        if(Array.isArray(data)){
          imgs = data;
        }else if(typeof data === 'object'){
          Object.keys(data).forEach(function(k){ if(data[k]) imgs.push(data[k]); });
        }
        callback(imgs);
      }else{
        callback([]);
      }
    }).catch(function(){ callback([]); });
  }

  function renderOrder(o){
    var idShort = (o.id||'').replace(/^cake_/i,'').replace(/^CAKE-/,'').substring(0,12);
    var dateStr = o.clientDate || (o.createdAt||'').substring(0,10) || '—';
    var timeStr = o.clientTime || '';
    var branchMap = {factory:'المصنع 🏭', main:'الفرع الرئيسي 🏪', shobramlees:'شبراملس 🏪', delivery:'توصيل 🚚', pickup:'المصنع 🏭'};
    var branch = branchMap[o.orderType] || o.otherBranch || o.orderType || '—';

    var html = '';
    // بطاقة المعلومات
    html += '<div class="card">';
    html += '<div class="info-grid">';
    html += '<div class="info-item"><div class="info-label">👤 العميل</div><div class="info-value">'+(o.clientName||'—')+'</div></div>';
    html += '<div class="info-item"><div class="info-label">🔢 رقم الطلب</div><div class="info-value">#'+idShort+'</div></div>';
    html += '<div class="info-item"><div class="info-label">📅 تاريخ الاستلام</div><div class="info-value">'+dateStr+'</div></div>';
    html += '<div class="info-item"><div class="info-label">🕐 الوقت</div><div class="info-value">'+(timeStr||'—')+'</div></div>';
    html += '<div class="info-item"><div class="info-label">🏪 مكان الاستلام</div><div class="info-value">'+branch+'</div></div>';
    if(o.size) html += '<div class="info-item"><div class="info-label">📐 المقاس</div><div class="info-value">'+o.size+'</div></div>';
    html += '</div></div>';

    // الصور
    html += '<div class="card img-section">';
    html += '<div class="img-title">🖼️ الصور المرجعية</div>';
    html += '<div id="imagesContainer"><div class="loading"><div class="spin">📸</div><div style="margin-top:8px;font-size:12px">جاري تحميل الصور...</div></div></div>';
    html += '</div>';

    document.getElementById('content').innerHTML = html;

    // جلب الصور
    loadImages(o.id, function(imgs){
      var container = document.getElementById('imagesContainer');
      if(!imgs.length){
        container.innerHTML = '<div style="text-align:center;padding:20px;color:#999"><div style="font-size:36px">📭</div><div style="margin-top:6px;font-size:13px;font-weight:700">لا توجد صور مرفقة لهذا الطلب</div></div>';
        return;
      }
      var out = '';
      imgs.forEach(function(img, i){
        var imgData = img.data || img;
        var label = img.label || ('صورة ' + (i+1));
        var fileName = (o.clientName||'order').replace(/[^a-zA-Z0-9\u0600-\u06FF ]/g,'') + '_' + idShort + '_' + dateStr + '_' + (i+1);
        out += '<div class="img-wrap">';
        out += '<img src="'+imgData+'" alt="'+label+'" onclick="window.open(this.src)"/>';
        out += '<div class="img-label">'+label;
        if(img.addedAt) out += ' · ' + img.addedAt.substring(0,16).replace('T',' ');
        out += '</div>';
        out += '</div>';
        out += '<a class="dl-btn" href="'+imgData+'" download="'+fileName+'.jpg">📥 تحميل '+label+'</a>';
        out += '<div style="height:12px"></div>';
      });
      container.innerHTML = out;
    });
  }

  function showError(title, detail){
    document.getElementById('content').innerHTML =
      '<div class="error">'+
        '<div class="icon">😔</div>'+
        '<div style="font-size:18px;font-weight:900">'+title+'</div>'+
        '<div style="font-size:13px;margin-top:6px;color:#666">'+(detail||'')+'</div>'+
      '</div>';
  }
})();
</script>
</body>
</html>
